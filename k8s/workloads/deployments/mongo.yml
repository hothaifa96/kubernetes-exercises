apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deploy
spec:
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        tier: db
    spec:
      containers:
      - name: mongo-container
        image: mongo
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: secret-password
          - name: MONGO_INITDB_ROOT_USERNAME
            value: "007"
          - name: MONGO_INITDB_DATABASE
            value: todo