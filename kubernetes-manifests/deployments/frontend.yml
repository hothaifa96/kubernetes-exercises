apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend:k8s
        ports:
        - containerPort: 3000
        env:
          - name: PRODUCTS_URL
            value: http://product.m-store.svc.cluster.local:3003
