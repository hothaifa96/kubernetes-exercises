apiVersion: batch/v1
kind: Job
metadata:
  name: python-data-job
  labels:
    app: python-job
spec:
  template:
    metadata:
      labels:
        app: python-job
    spec:
      containers:
      - name: python
        image: python:3.11-slim
        command: ["python3", "/app/data_processor.py"]
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: python-script
      restartPolicy: OnFailure
      backoffLimit: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-script
data:
  data_processor.py: |
    import json
    import random
    import time
    from datetime import datetime
    
    print("=" * 50)
    print("Kubernetes Job - Python Data Processing")
    print("=" * 50)
    print()
    
    # Simulate data processing
    print("1. Starting data processing...")
    time.sleep(2)
    
    # Generate sample data
    data = []
    for i in range(10):
        record = {
            "id": i + 1,
            "value": random.randint(1, 100),
            "timestamp": datetime.now().isoformat(),
            "status": "processed"
        }
        data.append(record)
    
    print(f"2. Generated {len(data)} data records")
    print()
    
    # Process and display data
    print("3. Processing data:")
    total_value = 0
    for record in data:
        print(f"   Record {record['id']}: value={record['value']}, status={record['status']}")
        total_value += record['value']
    
    print()
    print(f"4. Total value processed: {total_value}")
    print(f"5. Average value: {total_value / len(data):.2f}")
    
    # Save results
    result = {
        "total_records": len(data),
        "total_value": total_value,
        "average_value": total_value / len(data),
        "processed_at": datetime.now().isoformat()
    }
    
    print()
    print("6. Final result:")
    print(json.dumps(result, indent=2))
    
    print()
    print("=" * 50)
    print("Job completed successfully!")
    print("=" * 50)
