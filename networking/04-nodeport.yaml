# ============================================================
# LAB 4: Deployment Exposed via NodePort Service
# ============================================================
# KEY CONCEPT:
#   NodePort opens a static port (30000–32767) on EVERY cluster node.
#   Traffic flow:
#     External client → <NodeIP>:<NodePort> → Service → Pod
#
#   NodePort also creates a ClusterIP automatically, so internal
#   clients can still use the ClusterIP.
#
# ARCHITECTURE:
#
#   External ──► Node IP : 30080 ──────────────────────────────────┐
#                                                                    │
#                            ┌──────────────────────────────────┐   │
#                            │   Service: backend-nodeport       │ ◄─┘
#                            │   ClusterIP:  <auto>:80           │
#                            │   NodePort:   <all-nodes>:30080   │
#                            └──────┬───────────────┬────────────┘
#                                   │               │
#                            ┌──────▼────┐   ┌──────▼────┐
#                            │ backend-0 │   │ backend-1 │
#                            │  (nginx)  │   │  (nginx)  │
#                            └───────────┘   └───────────┘
#
# DEPLOY:
#   kubectl apply -f 04-nodeport.yaml
#
# CHECK THE SERVICE:
#   kubectl get svc backend-nodeport
#   # Note the PORT(S) column shows: 80:30080/TCP
#
# ACCESS FROM OUTSIDE THE CLUSTER:
#
#   ─── minikube ───────────────────────────────────────────────
#   minikube service backend-nodeport --url
#   curl $(minikube service backend-nodeport --url)
#
#   ─── kind ───────────────────────────────────────────────────
#   # kind requires extra port mapping in cluster config.
#   # See: https://kind.sigs.k8s.io/docs/user/configuration/#extra-port-mappings
#
#   ─── kubeadm / cloud ────────────────────────────────────────
#   NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
#   curl http://${NODE_IP}:30080
#
# CLEANUP:
#   kubectl delete -f 04-nodeport.yaml
# ============================================================
---
# ── Deployment: 2 nginx replicas ─────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-np
  labels:
    lab: "04-nodeport"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-np
  template:
    metadata:
      labels:
        app: backend-np
    spec:
      containers:
      - name: backend
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
---
# ── NodePort Service ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  labels:
    lab: "04-nodeport"
spec:
  type: NodePort
  selector:
    app: backend-np
  ports:
  - name: http
    port: 80          # ClusterIP port (inside cluster)
    targetPort: 80    # container port
    nodePort: 30080   # static external port on every Node
