# ============================================================
# LAB 5: Service Discovery via DNS (Kubernetes CoreDNS)
# ============================================================
# KEY CONCEPT:
#   Kubernetes runs CoreDNS. Every Service automatically gets
#   DNS records in the following forms:
#
#   ┌────────────────────────────────────────────────────────────┐
#   │  FORM                                      WORKS FROM      │
#   ├────────────────────────────────────────────────────────────┤
#   │  echo-server                               same namespace  │
#   │  echo-server.default                       any namespace   │
#   │  echo-server.default.svc                   any namespace   │
#   │  echo-server.default.svc.cluster.local     any namespace   │
#   └────────────────────────────────────────────────────────────┘
#
#   ALL of the above resolve to the SAME ClusterIP.
#   The short form works because /etc/resolv.conf in each Pod
#   has: search default.svc.cluster.local svc.cluster.local ...
#
# ARCHITECTURE:
#
#   ┌──────────────────────────────┐
#   │      dns-client Pod          │  ← exec into this pod
#   │  (busybox: nslookup + wget)  │
#   └──────────────────┬───────────┘
#                      │  nslookup / curl
#                      ▼
#   ┌──────────────────────────────┐
#   │   Service: echo-server       │  ← resolves to ClusterIP
#   └──────────────────┬───────────┘
#                      │
#           ┌──────────▼──────────┐
#           │  echo-server Pod(s) │
#           │  (http-echo image)  │
#           └─────────────────────┘
#
# DEPLOY:
#   kubectl apply -f 05-dns-discovery.yaml
#
# EXEC INTO DNS CLIENT:
#   kubectl exec -it dns-client -- sh
#
# INSIDE THE POD — TRY ALL DNS FORMS:
#   nslookup echo-server
#   nslookup echo-server.default
#   nslookup echo-server.default.svc.cluster.local
#
#   wget -qO- http://echo-server
#   wget -qO- http://echo-server.default
#   wget -qO- http://echo-server.default.svc.cluster.local
#
# SEE THE SEARCH DOMAINS THAT MAKE SHORT NAMES WORK:
#   cat /etc/resolv.conf
#
# CROSS-NAMESPACE NOTE:
#   Create a second namespace to show short names fail:
#   kubectl create namespace other
#   kubectl run test --image=busybox -n other --restart=Never -- sleep 3600
#   kubectl exec -n other test -- wget -qO- http://echo-server          # FAILS
#   kubectl exec -n other test -- wget -qO- http://echo-server.default  # WORKS
#
# CLEANUP:
#   kubectl delete -f 05-dns-discovery.yaml
# ============================================================
---
# ── Deployment: echo-server (returns a static text message) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  labels:
    lab: "05-dns-discovery"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:latest
        args:
        - "-text=Hello from echo-server! DNS is working."
        - "-listen=:5678"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: "20m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
---
# ── ClusterIP Service named 'echo-server' ────────────────────
# The Service NAME becomes the DNS hostname.
apiVersion: v1
kind: Service
metadata:
  name: echo-server          # ← THIS string becomes the DNS name
  labels:
    lab: "05-dns-discovery"
spec:
  type: ClusterIP
  selector:
    app: echo-server
  ports:
  - name: http
    port: 80
    targetPort: 5678
---
# ── DNS Client Pod (busybox has nslookup + wget built-in) ────
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  labels:
    lab: "05-dns-discovery"
spec:
  containers:
  - name: shell
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "=============================================="
      echo " DNS Discovery Demo"
      echo " All forms below resolve to the same ClusterIP"
      echo "=============================================="
      echo ""
      sleep 5
      echo "─── /etc/resolv.conf (explains short names) ──"
      cat /etc/resolv.conf
      echo ""
      echo "─── nslookup echo-server ──────────────────────"
      nslookup echo-server
      echo ""
      echo "─── nslookup echo-server.default ─────────────"
      nslookup echo-server.default
      echo ""
      echo "─── nslookup echo-server.default.svc.cluster.local ──"
      nslookup echo-server.default.svc.cluster.local
      echo ""
      echo "─── HTTP call via short name ──────────────────"
      wget -qO- http://echo-server
      echo ""
      echo "─── HTTP call via FQDN ────────────────────────"
      wget -qO- http://echo-server.default.svc.cluster.local
      echo ""
      echo "[dns-client] Demo complete. Pod staying alive for manual testing."
      echo "[dns-client] Run: kubectl exec -it dns-client -- sh"
      sleep infinity
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "32Mi"
