# ============================================================
# LAB 6 — Part 4: Orders Service (Deployment + ClusterIP Service)
# ============================================================
# Same sidecar pattern as order-service.
# SERVICE_NAME env var changes to "orders-service".
#
# DEPLOY:
#   kubectl apply -f 04-orders-service.yaml
#
# VIEW LOGS:
#   kubectl logs -l app=orders-service -c app      # app logs
#   kubectl logs -l app=orders-service -c logger   # sidecar logs
#
# HIT THE /ready ENDPOINT:
#   kubectl port-forward svc/orders-service 8082:8080
#   curl http://localhost:8082/ready
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  labels:
    lab: "06-microservices"
    app: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
        lab: "06-microservices"
    spec:
      volumes:
      - name: log-vol
        emptyDir: {}
      - name: scripts
        configMap:
          name: service-scripts
          items:
          - key: server.py
            path: server.py

      containers:
      - name: app
        image: python:3.11-slim
        command: ["python", "/app/server.py"]
        env:
        - name: SERVICE_NAME
          value: "orders-service"
        - name: PORT
          value: "8080"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: scripts
          mountPath: /app
        - name: log-vol
          mountPath: /var/log/app
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

      - name: logger
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /var/log/app
          touch /var/log/app/access.log
          echo "[logger-sidecar] Watching /var/log/app/access.log ..."
          exec tail -F /var/log/app/access.log
        volumeMounts:
        - name: log-vol
          mountPath: /var/log/app
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  labels:
    lab: "06-microservices"
    app: orders-service
spec:
  type: ClusterIP
  selector:
    app: orders-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
