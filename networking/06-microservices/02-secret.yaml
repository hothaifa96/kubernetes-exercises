# ============================================================
# LAB 6 — Part 2: Secret
# ============================================================
# Kubernetes Secrets store sensitive data (base64-encoded).
# This Secret holds credentials used by the frontend service.
#
# KEY POINTS:
#   • Values are base64-encoded in the YAML, NOT encrypted by default.
#   • At runtime, Kubernetes mounts them as plain text (env vars or files).
#   • For real security: enable etcd encryption or use Vault/ExternalSecrets.
#
# DECODE THE VALUES (base64 encoded):
#   echo "ZGVtby1hcGkta2V5LTEyMzQ1Ng==" | base64 -d   # → demo-api-key-123456
#   echo "c3VwZXItc2VjcmV0LWp3dA==" | base64 -d         # → super-secret-jwt
#
# VIEW SECRET (values are redacted by default):
#   kubectl get secret app-secret
#   kubectl describe secret app-secret
#
# DECODE FROM CLUSTER:
#   kubectl get secret app-secret -o jsonpath='{.data.API_KEY}' | base64 -d
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    lab: "06-microservices"
type: Opaque
data:
  # echo -n "demo-api-key-123456" | base64
  API_KEY: ZGVtby1hcGkta2V5LTEyMzQ1Ng==

  # echo -n "super-secret-jwt" | base64
  JWT_SECRET: c3VwZXItc2VjcmV0LWp3dA==
