# ============================================================
# LAB 6 — Part 3: order Service (Deployment + ClusterIP Service)
# ============================================================
# SIDECAR PATTERN:
#   Each Pod has 2 containers sharing an emptyDir volume:
#
#   ┌─────────────────────── Pod: order-service-<hash> ──────────────┐
#   │                                                                 │
#   │   ┌─────────────────────────┐   ┌──────────────────────────┐   │
#   │   │   app (python:3.11-slim)│   │  logger (busybox)        │   │
#   │   │   server.py             │   │  tail -F /var/log/app/   │   │
#   │   │   :8080                 │   │    access.log            │   │
#   │   └──────────┬──────────────┘   └───────────┬──────────────┘   │
#   │              │ writes                        │ reads            │
#   │              └─────────────┬─────────────────┘                  │
#   │                    emptyDir: /var/log/app/                       │
#   └──────────────────────────────────────────────────────────────────┘
#
# DEPLOY:
#   kubectl apply -f 03-order-service.yaml
#
# CHECK THE POD (both containers):
#   kubectl get pods -l app=order-service
#   kubectl describe pod -l app=order-service
#
# HIT THE /ready ENDPOINT:
#   kubectl port-forward svc/order-service 8081:8080
#   curl http://localhost:8081/ready
#
# VIEW MAIN APP LOGS:
#   kubectl logs -l app=order-service -c app
#
# VIEW LOGGER SIDECAR LOGS (shows access.log content):
#   kubectl logs -l app=order-service -c logger
#
# EXEC INTO THE POD:
#   kubectl exec -it $(kubectl get pod -l app=order-service -o name | head -1) -c app -- sh
#   > curl http://localhost:8080/ready
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    lab: "06-microservices"
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        lab: "06-microservices"
    spec:
      volumes:
      # Shared volume between app and logger sidecar
      - name: log-vol
        emptyDir: {}
      # Mount the server.py script from the shared ConfigMap
      - name: scripts
        configMap:
          name: service-scripts
          items:
          - key: server.py
            path: server.py

      containers:

      # ── Main application container ──────────────────────────
      - name: app
        image: python:3.11-slim
        command: ["python", "/app/server.py"]
        env:
        - name: SERVICE_NAME
          value: "order-service"
        - name: PORT
          value: "8080"
        # Downward API: inject this Pod's IP at runtime
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: scripts
          mountPath: /app
        - name: log-vol
          mountPath: /var/log/app
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

      # ── Logger sidecar container ────────────────────────────
      # Demonstrates the sidecar pattern:
      # reads the log file written by the app container
      - name: logger
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /var/log/app
          touch /var/log/app/access.log
          echo "[logger-sidecar] Watching /var/log/app/access.log ..."
          exec tail -F /var/log/app/access.log
        volumeMounts:
        - name: log-vol
          mountPath: /var/log/app
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
---
# ── ClusterIP Service ──────────────────────────────────────────
# DNS name inside the cluster: order-service
# or FQDN: order-service.default.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    lab: "06-microservices"
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
