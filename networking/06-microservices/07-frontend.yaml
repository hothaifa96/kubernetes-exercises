# ============================================================
# LAB 6 — Part 7: Frontend (ConfigMap + Deployment + NodePort Service)
# ============================================================
# FULL ARCHITECTURE:
#
#   External ──► NodePort :30090
#                    │
#          ┌─────────▼───────────────────────────────────────────┐
#          │          Service: frontend-svc (NodePort)            │
#          └─────────────────────┬───────────────────────────────┘
#                                │
#                    ┌───────────▼──────────────────┐
#                    │    Deployment: frontend        │
#                    │    2 replicas                  │
#                    │    ConfigMap → APP_ENV, URLs   │
#                    │    Secret    → API_KEY         │
#                    │    Downward  → POD_IP          │
#                    └──────┬──────────────┬──────────┘
#                           │ DNS calls    │
#             ┌─────────────┼──────────────┼──────────────────┐
#             ▼             ▼              ▼                   ▼
#         order-service  orders-service  products-service  notifications-service
#
# WHAT THE /ready ENDPOINT RETURNS:
#   curl http://<node-ip>:30090/ready
#   {
#     "frontend":      { "pod_ip": "10.x.x.x", "status": "ready", ... },
#     "order":          { "pod_ip": "10.x.x.x", "status": "ready", ... },
#     "orders":        { "pod_ip": "10.x.x.x", "status": "ready", ... },
#     "products":      { "pod_ip": "10.x.x.x", "status": "ready", ... },
#     "notifications": { "pod_ip": "10.x.x.x", "status": "ready", ... }
#   }
#
# DEPLOY (apply all lab-6 files):
#   kubectl apply -f 01-scripts-configmap.yaml
#   kubectl apply -f 02-secret.yaml
#   kubectl apply -f 03-order-service.yaml
#   kubectl apply -f 04-orders-service.yaml
#   kubectl apply -f 05-products-service.yaml
#   kubectl apply -f 06-notifications-service.yaml
#   kubectl apply -f 07-frontend.yaml
#   # or apply the whole folder:
#   kubectl apply -f .
#
# WAIT FOR ALL PODS TO BE READY:
#   kubectl get pods -l lab=06-microservices -w
#
# ACCESS THE FRONTEND (minikube):
#   minikube service frontend-svc --url
#   curl $(minikube service frontend-svc --url)/ready
#
# ACCESS THE FRONTEND (kubeadm / cloud):
#   NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')
#   curl http://${NODE_IP}:30090/ready
#
# PORT-FORWARD (works on any cluster type):
#   kubectl port-forward svc/frontend-svc 8090:8080
#   curl http://localhost:8090/ready
#
# VIEW ALL PODS AND THEIR IPs:
#   kubectl get pods -l lab=06-microservices -o wide
#
# WATCH FRONTEND CALLING BACKENDS (in real time):
#   kubectl logs -f -l app=frontend
#
# WATCH A BACKEND'S LOGGER SIDECAR (order example):
#   kubectl logs -f -l app=order-service -c logger
#
# CLEANUP ALL LAB-6 RESOURCES:
#   kubectl delete -f .
# ============================================================

---
# ── ConfigMap: frontend app configuration ─────────────────────
# Non-sensitive config. Injected as env vars into the container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    lab: "06-microservices"
    app: frontend
data:
  APP_ENV:           "production"
  PORT:              "8080"
  # Backend service URLs — uses Kubernetes DNS short names
  order_URL:          "http://order-service:8080"
  ORDERS_URL:        "http://orders-service:8080"
  PRODUCTS_URL:      "http://products-service:8080"
  NOTIFICATIONS_URL: "http://notifications-service:8080"

---
# ── Deployment: frontend (2 replicas) ────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    lab: "06-microservices"
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        lab: "06-microservices"
    spec:
      volumes:
      # Mount the frontend.py script from the shared scripts ConfigMap
      - name: scripts
        configMap:
          name: service-scripts
          items:
          - key: frontend.py
            path: frontend.py

      containers:
      - name: app
        image: python:3.11-slim
        command: ["python", "/app/frontend.py"]

        env:
        # ── From ConfigMap (non-sensitive config) ──────────────
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: APP_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: PORT
        - name: order_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: order_URL
        - name: ORDERS_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: ORDERS_URL
        - name: PRODUCTS_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: PRODUCTS_URL
        - name: NOTIFICATIONS_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NOTIFICATIONS_URL

        # ── From Secret (sensitive config) ─────────────────────
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: API_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET

        # ── From Downward API (pod metadata) ───────────────────
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        ports:
        - containerPort: 8080
          name: http

        volumeMounts:
        - name: scripts
          mountPath: /app

        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

---
# ── NodePort Service: expose frontend externally ──────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    lab: "06-microservices"
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 8080          # ClusterIP port
    targetPort: 8080    # Pod port
    nodePort: 30090     # External port on every Node
